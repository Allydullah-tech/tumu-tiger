<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uliza Kuhusu Filamu — TUMU TIGER</title>
<link rel="stylesheet" href="../css/style.css?v=4">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1F8A56">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TUMU TIGER">
<script src="../js/config.js?v=4"></script>
<script src="../js/pwa.js?v=1" defer></script>
</head>
<body>
<div id="navbar-placeholder"></div>

<section class="section" style="padding-top:14px; max-width:640px; margin:0 auto;">
  <div class="container">
    <span class="eyebrow">ULIZA</span>
    <h1 class="mt-8">Huoni Filamu Unayoitafuta?</h1>
    <p class="text-dim mt-8">Tuambie jina la filamu unayotafuta, tutakuambia kama ipo maktabani kwetu au tutakusaidia kuipata.</p>

    <div class="card mt-24">
      <div id="resultBox"></div>
      <div id="formWrap">
        <div id="alertBox"></div>
        <p class="text-dim small mb-16" id="accountInfoLine"></p>
        <form id="inquiryForm">
          <div class="form-group">
            <label>Jina la Filamu Unayotafuta</label>
            <input type="text" name="movie_title" id="movieTitleInput" required>
          </div>
          <div class="form-group">
            <label>Maelezo ya Ziada (hiari)</label>
            <textarea name="message" placeholder="Mfano: Mwaka wa filamu, mwigizaji, au lugha..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Tuma Swali</button>
        </form>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="../js/api.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script src="../js/auth-guard.js?v=4"></script>
<script src="../js/main.js?v=4"></script>
<script src="../js/pages/inquiry.js?v=4"></script>
</body>
</html>
