<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pakia Filamu — TUMU TIGER</title>
<link rel="stylesheet" href="../../css/style.css?v=4">
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#1F8A56">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TUMU TIGER">
<script src="../../js/config.js?v=4"></script>
<script src="../../js/pwa.js?v=1" defer></script>
</head>
<body data-active-page="upload">
<div class="app-shell">
  <div id="sidebar-placeholder"></div>
  <main class="main-content">
    <div class="topbar"><div><h1>Pakia Kifuniko cha Filamu</h1><p class="text-dim">Ongeza filamu mpya kwenye maktaba ili wateja waweze kuiona na kuiomba.</p></div></div>

    <div id="alertBox"></div>

    <div class="card" style="max-width:640px;">
      <form id="uploadForm" enctype="multipart/form-data">
        <div class="form-group">
          <label>Jina la Filamu</label>
          <input type="text" name="title" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Aina (Genre)</label>
            <input type="text" name="genre" placeholder="Mfano: Action, Drama, Komedi">
          </div>
          <div class="form-group">
            <label>Mwaka wa Utoaji</label>
            <input type="text" name="release_year" placeholder="Mfano: 2024">
          </div>
        </div>
        <div class="form-group">
          <label>Maelezo</label>
          <textarea name="description" placeholder="Andika maelezo mafupi ya hadithi ya filamu..."></textarea>
        </div>
        <div class="form-group">
          <label>Hali</label>
          <div class="pill-select">
            <label><input type="radio" name="status" value="available" checked><span>Ipo Maktabani</span></label>
            <label><input type="radio" name="status" value="not_available"><span>Haipo Kwa Sasa</span></label>
          </div>
        </div>
        <div class="form-group">
          <label>Kifuniko cha Filamu (Cover Image)</label>
          <input type="file" name="cover_image" accept=".jpg,.jpeg,.png,.webp">
          <p class="hint">JPG, PNG au WEBP — isiyozidi 6MB. Ukubwa mzuri: uwiano wa 2:3 (kama poster ya sinema).</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Pakia Filamu</button>
      </form>
    </div>
  </main>
</div>

<script src="../../js/api.js?v=4"></script>
<script src="../../js/ui.js?v=4"></script>
<script src="../../js/auth-guard.js?v=4"></script>
<script src="../../js/main.js?v=4"></script>
<script src="../../js/pages/admin-upload-movie.js?v=4"></script>
</body>
</html>
