<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rejesha Nenosiri — TUMU TIGER</title>
<link rel="stylesheet" href="../css/style.css?v=4">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1F8A56">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TUMU TIGER">
<script src="../js/config.js?v=4"></script>
<script src="../js/pwa.js?v=1" defer></script>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Rejesha Nenosiri</h2>
    <p class="sub">Tumia swali lako la usalama kurejesha ufikiaji wa akaunti yako.</p>

    <div id="alertBox"></div>

    <form id="stepEmailForm">
      <div class="form-group">
        <label>Barua Pepe ya Akaunti</label>
        <input type="email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Endelea</button>
    </form>

    <form id="stepAnswerForm" style="display:none;">
      <div class="form-group">
        <label id="securityQuestionLabel"></label>
        <input type="text" name="security_answer" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Thibitisha Jibu</button>
    </form>

    <form id="stepResetForm" style="display:none;">
      <div class="form-group">
        <label>Nenosiri Jipya</label>
        <input type="password" name="password" required>
      </div>
      <div class="form-group">
        <label>Thibitisha Nenosiri Jipya</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Badilisha Nenosiri</button>
    </form>

    <div class="auth-footer"><a href="login.html">← Rudi kuingia</a></div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="../js/api.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script src="../js/main.js?v=4"></script>
<script src="../js/pages/forgot-password.js?v=4"></script>
</body>
</html>
