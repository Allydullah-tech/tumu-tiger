<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jisajili — TUMU TIGER</title>
<link rel="stylesheet" href="../css/style.css?v=4">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1F8A56">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TUMU TIGER">
<script src="../js/config.js?v=4"></script>
<script src="../js/pwa.js?v=1" defer></script>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Fungua Akaunti</h2>
    <p class="sub">Jisajili ili uweze kuomba filamu, kuuliza kama filamu ipo, na kufuatilia maombi yako.</p>

    <div id="alertBox"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Jina Kamili</label>
        <input type="text" name="full_name" required>
      </div>
      <div class="form-group">
        <label>Barua Pepe</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Namba ya Simu (WhatsApp ikiwezekana)</label>
        <input type="tel" name="phone" placeholder="0700 000 000" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Nenosiri</label>
          <input type="password" name="password" required>
        </div>
        <div class="form-group">
          <label>Thibitisha Nenosiri</label>
          <input type="password" name="confirm_password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Jisajili Sasa</button>
    </form>
    <div class="auth-footer">Una akaunti tayari? <a href="login.html">Ingia hapa</a></div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="../js/api.js?v=4"></script>
<script src="../js/ui.js?v=4"></script>
<script src="../js/main.js?v=4"></script>
<script src="../js/pages/register.js?v=4"></script>
</body>
</html>
